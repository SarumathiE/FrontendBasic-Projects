<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>APEX LEX INSTITUTE - Registration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #151515;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 2px;
      color: #d4af37;
    }

    .logo p {
      margin: 8px 0 25px;
      color: #cccccc;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #dddddd;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #222;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #d4af37;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #d4af37;
      color: #000000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #f0cf63;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #173d25;
      color: #8cffad;
      text-align: center;
      line-height: 1.6;
    }

    .contact {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: #aaaaaa;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <h1>APEX LEX INSTITUTE</h1>
      <p>Online Moot Court Training Program</p>
    </div>

    <h2>Student Registration</h2>

    <form id="registrationForm">

      <label for="name">Student Full Name</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your full name"
        required
      >

      <label for="mobile">Mobile Number</label>
      <input
        type="tel"
        id="mobile"
        name="mobile"
        placeholder="Enter mobile number"
        pattern="[0-9]{10}"
        maxlength="10"
        required
      >

      <label for="email">Email ID</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter email address"
        required
      >

      <label for="standard">Class / Standard</label>
      <select id="standard" name="standard" required>
        <option value="">Select your standard</option>
        <option value="6th">6th Standard</option>
        <option value="7th">7th Standard</option>
        <option value="8th">8th Standard</option>
        <option value="9th">9th Standard</option>
        <option value="10th">10th Standard</option>
        <option value="11th">11th Standard</option>
        <option value="12th">12th Standard</option>
      </select>

      <button type="submit" id="submitBtn">
        REGISTER NOW
      </button>

    </form>

    <div id="message"></div>

    <div class="contact">
      <strong>APEX LEX INSTITUTE</strong><br>
      Conducted by Indhrajith S., BBA LLB (Hons.)<br><br>
      📞 8610486037<br>
      ✉️ jithu171101@gmail.com
    </div>

  </div>

  <script>
    const scriptURL =
      "https://script.google.com/macros/s/AKfycbwItIy253_j1VjILxMCoIgj78WTE53rTisBJXnGJ_VIw2F8UTy57wVMjyfLzL4ihz5s/exec";

    const form = document.getElementById("registrationForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", function (e) {

      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.textContent = "SUBMITTING...";

      const formData = new FormData(form);

      fetch(scriptURL, {
        method: "POST",
        body: formData,
        mode: "no-cors"
      })
      .then(function () {

        form.reset();

        message.innerHTML =
          "✅ Registration Successful!<br>" +
          "We will contact you shortly.";

        message.style.display = "block";

        submitBtn.disabled = false;
        submitBtn.textContent = "REGISTER NOW";

      })
      .catch(function (error) {

        console.error(error);

        message.innerHTML =
          "❌ Registration failed.<br>" +
          "Please try again.";

        message.style.display = "block";

        submitBtn.disabled = false;
        submitBtn.textContent = "REGISTER NOW";

      });

    });
  </script>

</body>
</html>
